<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f1720" />
    <title>加油墙管理 · 集成电路 4 班</title>
    <meta name="description" content="IC-4 运动会加油墙的负责人管理页：看墙上的内容，把不合适的下架。" />
    <link rel="stylesheet" href="styles.css?v=6ebd2198" />
  </head>
  <body class="standalone-page">
    <div class="admin-shell">
      <div class="standalone-bar">
        <p class="eyebrow">安徽大学 · 集成电路学院 · 集成电路 4 班</p>
        <p class="standalone-note">只有负责人需要这个页面，同学不用来。</p>
      </div>

      <main class="page-content" id="admin" tabindex="-1">
        <section class="panel">
          <header class="panel-header">
            <div>
              <h3>加油墙管理</h3>
              <p>同学写完就上墙，这里只用来看和下架</p>
            </div>
            <span class="badge green">已上墙</span>
          </header>
          <div class="panel-body">
            <div class="cheer-actions">
              <input class="admin-input" id="admin-secret" type="password" autocomplete="off" placeholder="口令" />
              <button class="primary-button" type="button" data-action="admin-load">看一下墙</button>
            </div>
            <p class="admin-msg" id="admin-msg"></p>
            <p class="admin-stats" id="admin-stats"></p>
            <div id="admin-list"></div>
            <p class="cheer-note">口令只在你自己的浏览器里用一次，关掉页面就忘了；看到不合适的点「下架」即可，同学刷新就看不到。</p>
          </div>
        </section>
      </main>

      <p class="standalone-footer">管理页 · 请勿把网址发给同学</p>
    </div>

    <noscript>
      <div class="admin-shell">
        <p class="eyebrow">这个页面需要浏览器打开 JavaScript 才能用。</p>
      </div>
    </noscript>

    <script src="assets/icons.js?v=6ebd2198"></script>
    <script src="config.js?v=6ebd2198"></script>
    <script src="cheer-api.js?v=6ebd2198"></script>
    <script src="admin.js?v=6ebd2198" defer></script>
  </body>
</html>
