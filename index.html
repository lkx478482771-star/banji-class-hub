<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="班集是一个面向大学生的班级共建工具，聚合互助、组队、资源共享、截止提醒与匿名意见。"
    />
    <meta name="theme-color" content="#f4f5f1" />
    <title>班集 · 班级共建站</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#today" data-action="navigate" data-page="today" aria-label="班集首页">
          <span class="brand-mark" aria-hidden="true">班</span>
          <span>
            <strong>班集</strong>
            <small>班级共建站</small>
          </span>
        </a>

        <nav class="main-nav" aria-label="主导航">
          <button class="nav-item is-active" type="button" data-action="navigate" data-page="today">
            <i data-lucide="layout-dashboard"></i>
            <span>今日班级</span>
          </button>
          <button class="nav-item" type="button" data-action="navigate" data-page="mutual-aid">
            <i data-lucide="hand-heart"></i>
            <span>互助广场</span>
            <span class="nav-count" id="nav-post-count">0</span>
          </button>
          <button class="nav-item" type="button" data-action="navigate" data-page="teams">
            <i data-lucide="users-round"></i>
            <span>任务搭子</span>
          </button>
          <button class="nav-item" type="button" data-action="navigate" data-page="resources">
            <i data-lucide="library-big"></i>
            <span>资源共享</span>
          </button>
          <button class="nav-item" type="button" data-action="navigate" data-page="members">
            <i data-lucide="contact-round"></i>
            <span>成员身份</span>
          </button>
          <button class="nav-item" type="button" data-action="navigate" data-page="feedback">
            <i data-lucide="message-square-lock"></i>
            <span>匿名意见箱</span>
          </button>
          <button class="nav-item" type="button" data-action="navigate" data-page="candidate">
            <i data-lucide="megaphone"></i>
            <span>我的竞选页</span>
          </button>
        </nav>

        <section class="sidebar-progress" aria-label="竞选主页完成度">
          <div class="progress-heading">
            <span id="readiness-label">竞选主页</span>
            <strong id="candidate-readiness">78%</strong>
          </div>
          <div class="progress-track" aria-hidden="true">
            <span id="candidate-progress-bar" style="width: 78%"></span>
          </div>
          <button class="text-button" type="button" data-action="open-profile">
            完善资料
            <i data-lucide="arrow-up-right"></i>
          </button>
        </section>

        <footer class="sidebar-footer">
          <span class="status-dot is-syncing" id="sync-dot" aria-hidden="true"></span>
          <span id="sync-status">正在连接班级云...</span>
        </footer>
      </aside>

      <button
        class="sidebar-scrim"
        id="sidebar-scrim"
        type="button"
        data-action="close-sidebar"
        aria-label="关闭导航"
      ></button>

      <div class="main-shell">
        <header class="topbar">
          <div class="topbar-left">
            <button
              class="icon-button mobile-menu"
              type="button"
              data-action="toggle-sidebar"
              aria-label="打开导航"
              title="打开导航"
            >
              <i data-lucide="menu"></i>
            </button>
            <div>
              <p class="eyebrow" id="page-eyebrow">班级服务台</p>
              <h1 id="page-title">今日班级</h1>
            </div>
          </div>

          <div class="topbar-actions">
            <button
              class="icon-button"
              type="button"
              data-action="open-search"
              aria-label="全局搜索"
              title="全局搜索"
            >
              <i data-lucide="search"></i>
            </button>
            <button
              class="icon-button notification-button"
              type="button"
              data-action="toggle-notifications"
              aria-label="通知"
              title="通知"
            >
              <i data-lucide="bell"></i>
              <span class="notification-dot" id="notification-dot"></span>
            </button>
            <button
              class="icon-button"
              type="button"
              data-action="logout"
              aria-label="退出登录"
              title="退出登录"
            >
              <i data-lucide="log-out"></i>
            </button>
            <button class="profile-button" type="button" data-action="open-profile">
              <span class="avatar" id="top-avatar">竞</span>
              <span class="profile-copy">
                <strong id="top-candidate-name">候选人</strong>
                <small id="top-role-label">普通同学</small>
              </span>
              <i data-lucide="chevron-down"></i>
            </button>
          </div>
        </header>

        <main class="page-content" id="app" tabindex="-1">
          <div class="loading-state">
            <span class="loading-mark">班</span>
            <p>正在准备工作台...</p>
          </div>
        </main>
      </div>
    </div>

    <div class="auth-root" id="auth-root"></div>

    <div class="notification-panel" id="notification-panel" hidden>
      <div class="panel-header">
        <div>
          <p class="eyebrow">班级脉搏</p>
          <h2>通知</h2>
        </div>
        <button
          class="icon-button compact"
          type="button"
          data-action="toggle-notifications"
          aria-label="关闭通知"
          title="关闭通知"
        >
          <i data-lucide="x"></i>
        </button>
      </div>
      <div id="notification-list"></div>
      <button class="secondary-button full-width" type="button" data-action="mark-notifications-read">
        <i data-lucide="check-check"></i>
        全部标为已读
      </button>
    </div>

    <div class="modal-root" id="modal-root"></div>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script src="config.js"></script>
    <script src="assets/lucide.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
